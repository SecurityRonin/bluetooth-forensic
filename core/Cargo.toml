[package]
# `bluetooth-core` is unpublishable: crates.io treats `-`/`_` as one name and `bluetooth_core`
# (an unrelated BLE/btleplug wrapper) already claims it — so the reader takes the `<repo>-core`
# form per the fleet naming grammar (cf. zfs-forensic-core). Import path stays `bluetooth_core`.
name = "bluetooth-forensic-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Pure-Rust read-only decoder for Windows Bluetooth pairing/connection evidence stored under SYSTEM\\…\\BTHPORT\\Parameters\\Devices — decodes a device MAC (subkey name), friendly Name (REG_SZ or REG_BINARY), and LastSeen/LastConnected FILETIMEs from raw value bytes. No hive I/O; panic-free."
license.workspace = true
authors.workspace = true
keywords = ["forensics", "bluetooth", "windows", "dfir", "bthport"]
categories = ["parser-implementations"]
repository.workspace = true
readme.workspace = true
exclude = ["tests/data/", "fuzz/"]

[lib]
name = "bluetooth_core"

[dependencies]

[lints]
workspace = true
