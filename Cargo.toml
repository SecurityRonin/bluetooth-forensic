[workspace]
resolver = "2"
members = ["core", "forensic"]

# Single source of truth for shared fields (DRY). `version` is NOT hoisted — core and forensic
# are versioned independently.
[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Albert Hui <albert@securityronin.com>"]
repository = "https://github.com/SecurityRonin/bluetooth-forensic"
readme = "README.md"

[workspace.dependencies]
# The package is `bluetooth-forensic-core` (crates.io treats `-`/`_` as one name, and
# `bluetooth_core` — an unrelated BLE/btleplug wrapper — already claims it); the dep alias
# keeps the `bluetooth_core` import path.
bluetooth-core = { path = "core", version = "0.1.0", package = "bluetooth-forensic-core" }
# Generic REGF hive parser — Bluetooth pairings live in the SYSTEM hive, so the binary walks it
# with winreg-core.
winreg-core = "0.2"
forensicnomicon = "1"
# Used only to derive the datable-instant bound (`Timestamp::MAX`) that gates a raw FILETIME before
# it reaches winreg-core's converter — see forensic/src/lib.rs::datable_filetime. Same jiff major
# winreg-core itself pulls.
jiff = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all                   = { level = "warn", priority = -1 }
pedantic              = { level = "warn", priority = -1 }
correctness           = { level = "deny",  priority = -1 }
suspicious            = { level = "deny",  priority = -1 }
unwrap_used           = { level = "deny",  priority = 0  }
expect_used           = { level = "deny",  priority = 0  }
module_name_repetitions = { level = "allow", priority = 1 }
must_use_candidate    = { level = "allow", priority = 1 }
missing_errors_doc    = { level = "allow", priority = 1 }
missing_panics_doc    = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap    = { level = "allow", priority = 1 }
cast_sign_loss        = { level = "allow", priority = 1 }
cast_precision_loss   = { level = "allow", priority = 1 }
too_many_lines        = { level = "allow", priority = 1 }
