[package]
name = "bluetooth-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
bluetooth-core = { path = "../core", package = "bluetooth-forensic-core" }
bluetooth-forensic = { path = "../forensic" }
# For the `Observation` trait, whose projections (note/subjects/severity/mitre) the target exercises.
forensicnomicon = "1"

[[bin]]
name = "fuzz_parse"
path = "fuzz_targets/fuzz_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_forensic"
path = "fuzz_targets/fuzz_forensic.rs"
test = false
doc = false
bench = false
